<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F4F5FB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TIU " />
    <meta name="format-detection" content="telephone=no" />
    <title>TIU</title>
    <style>
:root {
        --orange: #fa7525; /* El naranja exacto del logo */
        --orange-line: rgba(250, 117, 37, 0.78); /* La línea animada con el mismo tono pero translúcida */
        --paper: #f4f5fb;
        --soft-text: #fa7525; /* Mantenemos el color sólido para los textos editables */
        --scan-height: 16px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      body {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
font-family: Arial, Helvetica, sans-serif;
      }

      .screen {
        position: relative;
        width: min(100vw, 430px);
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
        background:
          radial-gradient(circle at 78% 22%, rgba(255, 255, 255, 0.9) 0 1px, transparent 21px),
          linear-gradient(180deg, #f8f8fd 0%, #f3f4fa 100%);
        isolation: isolate;
      }



.brand {
        position: absolute;
        top: clamp(40px, 6dvh, 60px); /* Le damos un poco de respiro desde arriba */
        left: 50%;
        z-index: 3;
        display: grid;
        justify-items: center;
        width: 118px;
        transform: translateX(-50%);
      }

      .brand-logo {
        display: block;
        width: clamp(82px, 24vw, 102px);
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
      }



.identity {
        position: absolute;
        top: clamp(155px, 20dvh, 185px); /* Subimos todo el bloque de nombres y código */
        left: 50%;
        z-index: 4;
        width: min(82vw, 330px);
        transform: translateX(-50%);
        color: var(--soft-text);
        text-align: center;
        text-transform: uppercase;
      }

      .editable {
        min-height: 1.08em;
        outline: none;
        caret-color: var(--orange);
        overflow-wrap: anywhere;
      }

      .editable:empty::before {
        content: attr(data-placeholder);
        color: rgba(191, 106, 65, 0.42);
      }

.name-line {
        font-size: clamp(1.25rem, 5.5vw, 1.45rem); /* Tamaño ligeramente más grande */
        font-weight: 500; 
        line-height: 1.08;
      }

.code-line {
        margin-top: clamp(7px, 1.15dvh, 10px);
        font-size: clamp(1.25rem, 5.5vw, 1.45rem); /* Ahora tiene exactamente el mismo tamaño que los nombres */
        font-weight: 400; 
        line-height: 1;
      }

.photo-button {
        position: absolute;
        top: clamp(450px, 54dvh, 510px); /* La bajamos un poco para mantener la proporción */
        left: 50%;
        z-index: 4;
        width: clamp(178px, 50vw, 215px);
        aspect-ratio: 0.83;
        padding: 0;
        transform: translate(-50%, -50%);
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .photo-button:focus {
        outline: none;
      }

      .photo-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

.role {
        position: absolute;
        left: 50%;
        bottom: clamp(130px, 18.5dvh, 148px); /* Lo subimos para que flote en el punto medio exacto, tirando al código */
        z-index: 4;
        min-width: 10ch;
        transform: translateX(-50%);
        color: var(--orange);
        font-size: clamp(1.05rem, 4.2vw, 1.2rem); /* Letra más pequeña y fina, como en la foto */
        font-weight: 400;
        line-height: 1;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

.barcode-wrap {
        position: absolute;
        left: 0;
        bottom: clamp(45px, 6.5dvh, 65px); /* Distancia exacta desde el borde inferior del celular */
        z-index: 10;
        width: 100%;
        height: clamp(65px, 9.5dvh, 80px); /* Lo hacemos un poco más alto, como se ve en tu foto */
        background: #f3f4fa; 
        display: flex;
        justify-content: center;
        align-items: center;
        transform: none;
      }

      #barcode {
        display: block;
        width: min(79vw, 338px); /* Mantiene el tamaño del código intacto en el centro */
        height: 100%;
      }

.scanner {
        position: absolute;
        top: 0;
        left: -10vw; /* Desborda la línea hacia la izquierda intencionalmente */
        width: 120vw; /* La hace un 20% más ancha que la pantalla completa */
        z-index: 5;
        height: 16px;
        background: var(--orange-line);
        pointer-events: none;
        animation: scan-bounce 0.89s linear infinite alternate;
      }

      @keyframes scan-bounce {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(calc(100dvh - 16px)); /* Calculado con los 16px */
        }
      }

      @keyframes scan-down {
        0% {
          transform: translateY(0);
        }

        99.85% {
          transform: translateY(calc(100dvh - var(--scan-height)));
        }

        100% {
          transform: translateY(0);
        }
      }

@media (max-height: 735px) {
        .brand {
          top: 30px; 
        }
        
        .brand-logo {
          width: 76px;
        }

        .identity {
          top: 125px; /* Nombres más arriba en pantallas pequeñas */
        }
        
        .photo-button {
          top: 52dvh; 
          width: 146px;
        }

        .photo-button img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center top;
          user-select: none;
          -webkit-user-drag: none;
          mix-blend-mode: multiply; 
        }

        .role {
          bottom: 115px; 
        }
        
        .barcode-wrap {
          bottom: 30px;
          height: 60px;
        }
      }
    </style>
  </head>

      <section class="identity" aria-label="Datos editables">
        <div class="editable name-line" contenteditable="true" spellcheck="false" data-placeholder="APELLIDOS"></div>
        <div class="editable name-line" contenteditable="true" spellcheck="false" data-placeholder="NOMBRES"></div>
        <div
          id="codeField"
          class="editable code-line"
          contenteditable="true"
          inputmode="numeric"
          spellcheck="false"
          data-placeholder="20240883"
        ></div>
      </section>

      <button class="photo-button" id="photoButton" type="button" title="Cambiar foto" aria-label="Cambiar foto de perfil">
        <img
          id="profileImage"
          alt="Foto de perfil"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 218 263'%3E%3Crect width='218' height='263' fill='%23f3f4fa'/%3E%3Ccircle cx='109' cy='86' r='42' fill='%23c5cad6'/%3E%3Cpath d='M37 249c7-66 37-102 72-102s65 36 72 102z' fill='%23b7bdca'/%3E%3Cpath d='M56 249c9-43 29-67 53-67s44 24 53 67z' fill='%23d7dae3' opacity='.7'/%3E%3Ctext x='109' y='258' text-anchor='middle' font-family='Arial' font-size='13' fill='%23d20000' font-weight='700' opacity='.82'%3E%3C/text%3E%3C/svg%3E"
        />
      </button>
      <input class="photo-input" id="photoInput" type="file" accept="image/*" />

      <div class="role">ALUMNO</div>

      <div class="barcode-wrap" aria-label="Codigo de barras decorativo no valido">
        <svg id="barcode" viewBox="0 0 340 72" role="img" aria-label="Codigo de barras demo"></svg>
      </div>

      <div class="scanner" aria-hidden="true"></div>
    </main>

    <script>
      (() => {
        const orange = "#BF6A41";
        const profileButton = document.getElementById("photoButton");
        const profileInput = document.getElementById("photoInput");
        const profileImage = document.getElementById("profileImage");
        const codeField = document.getElementById("codeField");
        const barcode = document.getElementById("barcode");

        const iconSvg =
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23f4f5fb'/><text x='256' y='248' text-anchor='middle' font-family='Arial' font-weight='800' font-size='100' fill='%23bf6a41'>TIU</text><text x='256' y='348' text-anchor='middle' font-family='Arial' font-weight='800' font-size='62' fill='%23d20000' opacity='.65'>DEMO</text></svg>";

        const manifest = {
          name: "TIU Demo",
          short_name: "TIU Demo",
          start_url: ".",
          scope: ".",
          display: "standalone",
          orientation: "portrait",
          background_color: "#f4f5fb",
          theme_color: orange,
          icons: [
            {
              src: "data:image/svg+xml," + iconSvg,
              sizes: "512x512",
              type: "image/svg+xml",
              purpose: "any maskable"
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        const manifestLink = document.createElement("link");
        manifestLink.rel = "manifest";
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        const normalizeText = (value) => value.replace(/\s+/g, " ").trim().toUpperCase();

        const hashText = (text) => {
          let hash = 2166136261;
          for (let i = 0; i < text.length; i += 1) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
          }
          return hash >>> 0;
        };

        const nextRand = (state) => (Math.imul(state, 1664525) + 1013904223) >>> 0;

        const renderBarcode = () => {
          const value = normalizeText(codeField.textContent || codeField.dataset.placeholder || "");
          let state = hashText(value + ":decorative-");
          let x = 4;
          const height = 68;
          const pieces = ['<rect width="340" height="72" fill="transparent"/>'];

while (x < 334) {
            state = nextRand(state);
            const barWidth = 3 + (state % 7); // Aumentamos el grosor base de las líneas (de 2 a 3 y de %6 a %7)
            state = nextRand(state);
            const gap = 3 + (state % 5); // Aumentamos un poco la separación (de 2 a 3)
            pieces.push(`<rect x="${x}" y="2" width="${Math.min(barWidth, 334 - x)}" height="${height}" fill="#101217"/>`);
            x += barWidth + gap;
          }

          barcode.innerHTML = pieces.join("");
        };

        profileButton.addEventListener("click", () => profileInput.click());

        profileInput.addEventListener("change", () => {
          const file = profileInput.files && profileInput.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.addEventListener("load", () => {
            profileImage.src = reader.result;
          });
          reader.readAsDataURL(file);
        });

        codeField.addEventListener("input", renderBarcode);
        renderBarcode();

        document.addEventListener(
          "touchmove",
          (event) => {
            if (event.touches.length > 1) event.preventDefault();
          },
          { passive: false }
        );

        let lastTouchEnd = 0;
        document.addEventListener(
          "touchend",
          (event) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) event.preventDefault();
            lastTouchEnd = now;
          },
          false
        );
// Mantener la pantalla encendida automáticamente
        if ('wakeLock' in navigator) {
          let wakeLock = null;
          const requestWakeLock = async () => {
            try {
              wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
              console.log('Wake Lock falló:', err);
            }
          };
          requestWakeLock();
          
          // Reconectar si la app se minimiza y se vuelve a abrir
          document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
              requestWakeLock();
            }
          });
        }
        document.addEventListener(
          "wheel",
          (event) => {
            if (event.ctrlKey) event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener("gesturestart", (event) => event.preventDefault());
      })();
    </script>
  </body>
</html>
